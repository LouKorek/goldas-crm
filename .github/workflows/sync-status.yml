# Reads the matches-sync health check from outside Netlify, so a run can be
# verified without the Firebase console. Read-only: it calls the public
# status endpoints and nothing that spends ScraperAPI credits.
name: Sync status
on:
  workflow_dispatch:
  push:
    branches: ['claude/status-check']
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: sync-status
        run: curl -sS --max-time 60 "https://goldas-crm.netlify.app/.netlify/functions/sync-status?player=Barzilai"
      - name: football.org.il reachable from here?
        run: |
          curl -sS --max-time 40 -o p.html -w "%{http_code} %{size_download}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "Accept-Language: he-IL,he;q=0.9" \
            "https://www.football.org.il/players/player/?player_id=185403" || true
          grep -o "<title>[^<]*" p.html | head -1 || true
          grep -o 'new-player-data_title[^<]*<[^>]*>[^<]*' p.html | head -2 || true
