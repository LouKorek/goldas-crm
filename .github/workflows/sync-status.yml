# Reads the matches-sync health check from outside Netlify, so a run can be
# verified without the Firebase console. Read-only: it calls the public
# status endpoints and nothing that writes.
name: Sync status
on:
  workflow_dispatch:
  push:
    branches: ['claude/status-check']
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: wait for ifa-targets to be deployed, check the secret is configured
        run: |
          B=https://goldas-crm.netlify.app/.netlify/functions
          for i in $(seq 1 1); do
            C=$(curl -s -o /dev/null -w "%{http_code}" -H "x-sync-secret: wrong" "$B/ifa-targets")
            echo "$(date -u +%T) ifa-targets with a wrong secret -> $C (403 = deployed and configured, 503 = secret missing, 404 = not deployed)"
            [ "$C" = "403" ] && break
            sleep 30
          done
          curl -s -o /dev/null -w "tools/ifa-browser-sync.js -> %{http_code} %{content_type}\n" "https://goldas-crm.netlify.app/tools/ifa-browser-sync.js"
          curl -s -o /dev/null -w "tools/ifa-text.js -> %{http_code} %{content_type}\n" "https://goldas-crm.netlify.app/tools/ifa-text.js"
          curl -sS --max-time 60 "$B/sync-status?player=Barzilai" | jq -c .
