# Reads the matches-sync health check from outside Netlify, so a run can be
# verified without the Firebase console. Read-only: it calls the public
# status endpoints and nothing that spends ScraperAPI credits.
name: Sync status
on:
  workflow_dispatch:
  push:
    branches: ['claude/status-check']
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: sync-status
        run: curl -sS --max-time 60 "https://goldas-crm.netlify.app/.netlify/functions/sync-status?player=Barzilai" | jq -c .
      - name: free readers for football.org.il
        run: |
          T="https://www.football.org.il/team-details/team-games/?team_id=1146"
          for R in "https://r.jina.ai/$T" ; do
            echo "== $R"
            curl -sS --max-time 90 -o out.txt -w "%{http_code} %{size_download}\n" "$R" || true
            head -c 2500 out.txt; echo
          done
          echo "== jina html"
          curl -sS --max-time 90 -H "X-Return-Format: html" -o out.html -w "%{http_code} %{size_download}\n" "https://r.jina.ai/$T" || true
          grep -o 'table_row link_url' out.html | wc -l
          grep -o '<title>[^<]*' out.html | head -1
