# Reads the matches-sync health check from outside Netlify, so a run can be
# verified without the Firebase console. Read-only: it calls the public
# status endpoints and nothing that spends ScraperAPI credits.
name: Sync status
on:
  workflow_dispatch:
  push:
    branches: ['claude/status-check']
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: wait for a sync that finished after AFTER, then print it
        env:
          AFTER: '2026-10-09T16:31:00Z'
        run: |
          U="https://goldas-crm.netlify.app/.netlify/functions/sync-status?player=Barzilai"
          for i in $(seq 1 22); do
            J=$(curl -sS --max-time 60 "$U" || echo '{}')
            S=$(echo "$J" | jq -r '.status.state // "?"'); F=$(echo "$J" | jq -r '.status.finishedAt // ""')
            echo "$(date -u +%T) state=$S finishedAt=$F startedAt=$(echo "$J" | jq -r '.status.startedAt // ""')"
            if [ "$S" = "idle" ] && [[ "$F" > "$AFTER" ]]; then break; fi
            sleep 60
          done
          echo "$J" | jq .
