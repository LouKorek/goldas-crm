# Reads the matches-sync health check from outside Netlify, so a run can be
# verified without the Firebase console. Read-only: it calls the public
# status endpoints and nothing that spends ScraperAPI credits.
name: Sync status
on:
  workflow_dispatch:
  push:
    branches: ['claude/status-check']
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: sync-status
        run: curl -sS --max-time 60 "https://goldas-crm.netlify.app/.netlify/functions/sync-status?player=Barzilai" | jq -c .
      - name: scraper-status (free account endpoint)
        run: curl -sS --max-time 60 "https://goldas-crm.netlify.app/.netlify/functions/scraper-status" | jq -c .
