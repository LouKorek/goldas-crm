[build]
  # Builds the shared domain package first, then the Vite web app.
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  # Cheerio 1.x (used by the IFA parser in sync-matches) references the
  # global `File` Web API, which Node 18 doesn't expose. Node 20 does.
  NODE_VERSION = "20"

# Netlify Functions. Schedules are declared in each function via the
# @netlify/functions `schedule()` wrapper.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
