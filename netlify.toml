[build]
  # Builds the shared domain package first, then the Vite web app.
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  # Cheerio 1.x (used by the IFA parser in sync-matches) references the
  # global `File` Web API, which Node 18 doesn't expose. Node 20 does.
  NODE_VERSION = "20"

# Netlify Functions. Schedules are declared in each function via the
# @netlify/functions `schedule()` wrapper.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# Build files carry a content hash in their name, so the browser may keep
# them for good; index.html and sw.js stay fresh so a deploy shows at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Golda's profile photo is resized by Netlify's image CDN before it goes to
# WhatsApp (lib/golda-photo.js); this is the only remote host it may fetch.
[images]
  remote_images = ["https://d8j0ntlcm91z4\\.cloudfront\\.net/.*"]
