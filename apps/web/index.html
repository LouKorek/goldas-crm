<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <!-- Zoom is allowed: text follows the device's accessibility settings. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA / Theme -->
  <meta name="theme-color" content="#F6F3EC" />
  <meta name="application-name" content="Gold A&S" />
  <meta name="description" content="Gold A&S — מערכת ניהול סוכנות הכדורגל" />

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gold A&S" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Favicon -->
  <link rel="icon" href="/brand-mark.png" />

  <!-- Hebrew face, served from this site so the UI and the PDFs share one font -->
  <link rel="preload" href="/fonts/Heebo-400.ttf" as="font" type="font/ttf" crossorigin />

  <title>Gold A&S — סוכנות כדורגל</title>
  <!-- Day / night before the first paint (same key as src/lib/theme.js). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#121410');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
